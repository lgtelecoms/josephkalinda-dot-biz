services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: josephkalinda
    ports:
      - "5432:5432"
    volumes:
      - jk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d josephkalinda"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jk_pgdata:
